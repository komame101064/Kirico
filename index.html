<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<meta name="description" content="加工条件（旋削・フライス・ドリル・タップ・研削）、図面寸法、単位変換の計算と現場ノートをまとめた製造現場向けツール">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff9f0a'/%3E%3Crect x='19' y='11' width='26' height='42' rx='5' fill='none' stroke='white' stroke-width='3.5'/%3E%3Crect x='24' y='16' width='16' height='7' rx='1.5' fill='white'/%3E%3Cg fill='white'%3E%3Ccircle cx='26' cy='31' r='2'/%3E%3Ccircle cx='32' cy='31' r='2'/%3E%3Ccircle cx='38' cy='31' r='2'/%3E%3Ccircle cx='26' cy='39' r='2'/%3E%3Ccircle cx='32' cy='39' r='2'/%3E%3Ccircle cx='38' cy='39' r='2'/%3E%3Ccircle cx='26' cy='47' r='2'/%3E%3Ccircle cx='32' cy='47' r='2'/%3E%3Ccircle cx='38' cy='47' r='2'/%3E%3C/g%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}</style>
<title>Kirico</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: Apple/Google 系のアプリ構成。淡いグレーの面に白いカード、細い区切り線、太い大見出し、単色アクセント（青）。
   左はサイドバー（iPadOS 風）、スマホは下部タブバー。電卓は iOS 電卓風の丸いキー。 */
:root{
  color-scheme:light;
  --bg:#f5f5f7; --surface:#ffffff; --sunken:#f2f2f7; --track:#e8e8ed; --fill:#7676801f;
  --ink:#1d1d1f; --muted:#6e6e73; --faint:#8e8e93; --line:#e5e5ea; --line-2:#d2d2d7;
  --accent:#0071e3; --accent-ink:#0066cc; --accent-soft:#e8f1fc;
  --orange:#ff9f0a; --calc-dark:#1c1c1e; --calc-key:#333336; --calc-fn:#a5a5aa;
  --ok:#1f9d55; --ok-soft:#e3f6ea; --warn:#c75300; --warn-soft:#fff1e0; --danger:#e0281b; --danger-soft:#ffe9e7;
  --blue:#0071e3; --blue-soft:#e8f1fc;
  --steel:#7d93ab; --steel-2:#b7c5d4; --chip:#d7dde4; --paper:#fbfbfd; --grid:#eef0f3;
  --amber:#ff9f0a; --amber-ink:#b35c00; --amber-soft:#fff3e0;
  --navy:#1d1d1f; --navy-2:#2c2c2e; --navy-ink:#fff; --navy-muted:#a1a1a6; --navy-line:rgba(255,255,255,.12);
  --shadow:0 1px 1px rgba(0,0,0,.02),0 4px 14px rgba(0,0,0,.04);
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
  --f-num:-apple-system,BlinkMacSystemFont,"SF Pro Display","Inter","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --navh:0px; --r-card:20px;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;letter-spacing:.005em}
svg.i{width:1em;height:1em;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,[tabindex]:focus-visible{outline:3px solid #0071e366;outline-offset:2px}
.num,.dro-v,.ctl input,table.detail td,table.ref td{font-variant-numeric:tabular-nums}

/* ===== アプリアイコン（iOS 設定風のフラットなタイル） ===== */
.key{--kc:#8e8e93;display:inline-grid;place-items:center;flex:none;width:28px;height:28px;font-size:17px;border-radius:7px;color:#fff;background:var(--kc)}
.key svg.i{stroke-width:2}
.key.xl{width:52px;height:52px;font-size:29px;border-radius:13px}
.k-calc{--kc:#ff9f0a}.k-units{--kc:#5e5ce6}.k-turn{--kc:#007aff}.k-mill{--kc:#00a7a0}.k-drill{--kc:#af52de}.k-tap{--kc:#ff2d55}.k-grind{--kc:#ff6b00}
.k-tri{--kc:#34c759}.k-taper{--kc:#32ade6}.k-pcd{--kc:#5856d6}.k-sine{--kc:#a2845e}.k-arc{--kc:#ff3b30}.k-notes,.k-memo{--kc:#ffb800}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(180deg,#ffb340,#ff9500);color:#fff;display:grid;place-items:center;flex:none;font-size:22px}
.logo svg.i{stroke-width:2}

/* ===== シェル ===== */
.app{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:#f5f5f7ee;border-right:1px solid var(--line);padding:22px 12px 16px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.brand small{display:block;font-size:12px;color:var(--muted)}
.navgroup{display:flex;flex-direction:column;gap:1px}
.navgroup h3{margin:0 0 4px;padding:0 10px;font-size:12px;font-weight:600;color:var(--faint)}
.navgroup button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--ink);padding:6px 10px;border-radius:9px;cursor:pointer;font-size:15px;text-align:left;position:relative;min-height:40px}
.navgroup button:hover{background:#0000000a}
.navgroup button[aria-current="page"]{background:var(--accent);color:#fff;font-weight:600}
.badge{margin-left:auto;font-size:12px;font-weight:600;color:var(--muted);line-height:1.6;font-variant-numeric:tabular-nums}
.navgroup button[aria-current="page"] .badge{color:#fff}
.side-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:12px 10px 0;display:flex;gap:8px;align-items:flex-start}
.side-foot svg{font-size:15px;margin-top:2px}
.main{min-width:0;padding-block:28px 56px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.main-in{max-width:1140px;margin:0 auto}
.mtop,.bnav,.subnav{display:none}

@media (max-width:959px){
  :root{--navh:58px}
  .app{display:block}
  .side{display:none}
  .main{padding-block:0 calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  body.has-dock .main{padding-bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom,0px))}
  .mtop{display:flex;align-items:center;gap:9px;padding-block:14px 6px}
  .mtop .logo{width:28px;height:28px;font-size:17px;border-radius:7px}
  .mtop b{font-size:16px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
  .mtop .st{margin-left:auto}
  .mtop .store{font-size:11.5px;padding:4px 9px;white-space:nowrap}
  .bnav{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:#f9f9fbe6;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid #0000002e;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
  .bnav button{height:var(--navh);border:0;background:transparent;color:var(--faint);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:500;cursor:pointer;position:relative}
  .bnav button svg{font-size:25px}
  .bnav button[aria-current="page"]{color:var(--accent)}
  .bnav .badge{position:absolute;top:5px;left:calc(50% + 8px);font-size:10px;color:#fff;background:#ff3b30;border-radius:99px;padding:0 5px;line-height:1.5;min-width:17px;text-align:center}
  .subnav{display:flex;gap:8px;overflow-x:auto;margin:6px -16px 14px;padding:2px 16px 4px;scrollbar-width:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:none;display:flex;align-items:center;gap:7px;border:0;background:var(--surface);color:var(--ink);padding:6px 14px 6px 7px;border-radius:99px;font-size:14px;font-weight:500;cursor:pointer;box-shadow:0 0 0 1px var(--line)}
  .subnav .key{width:22px;height:22px;font-size:14px;border-radius:6px}
  .subnav button[aria-current="page"]{background:var(--ink);color:#fff;box-shadow:none}
}

/* ===== 見出し ===== */
.vhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
.vtitle{display:flex;align-items:center;gap:16px;min-width:0}
.crumb{font-size:13px;font-weight:600;color:var(--faint)}
.vtitle h2{margin:0;font-size:32px;font-weight:700;line-height:1.15;letter-spacing:-.015em;text-wrap:balance}
.vtitle p{margin:4px 0 0;font-size:15px;color:var(--muted)}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:var(--fill);color:var(--accent-ink);padding:9px 18px;border-radius:99px;cursor:pointer;font-size:15px;font-weight:600;min-height:42px;white-space:nowrap;transition:background .15s,transform .1s}
.btn svg{font-size:17px}
.btn:hover{background:#76768033}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#0077ed}
.btn.ghost{background:transparent;color:var(--accent-ink)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.small{min-height:34px;padding:6px 13px;font-size:14px}
.btn.danger{color:var(--danger)}
.btn.danger:hover{background:var(--danger-soft)}
.btn:disabled{opacity:.45;cursor:default}
@media (max-width:640px){.key.xl{width:44px;height:44px;font-size:24px;border-radius:11px}.vtitle h2{font-size:28px}.vtitle p{font-size:14px}.vhead{margin-bottom:16px}.vhead .actions{width:100%}.vhead .actions .btn{flex:1}}

/* ===== カード・入力（iOS のグループ化リスト風） ===== */
.tgrid{display:grid;grid-template-columns:minmax(0,390px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1060px){.tgrid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--surface);border-radius:var(--r-card);padding:20px;min-width:0;box-shadow:var(--shadow)}
.h{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;color:var(--ink);letter-spacing:-.005em;margin:0 0 14px}
.h svg{font-size:19px;color:var(--accent)}
.stack{display:flex;flex-direction:column;gap:20px;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.sel{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.selbox{position:relative}
.selbox>svg{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:15px;color:var(--faint);pointer-events:none}
select{appearance:none;-webkit-appearance:none;font:inherit;font-size:15px;font-weight:500;padding:10px 32px 10px 13px;border:0;border-radius:11px;background:var(--sunken);color:var(--ink);width:100%;min-height:44px;cursor:pointer}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:10px;padding:2px;gap:2px;margin:16px 0 6px}
.seg button{font-size:14px;font-weight:500;border:0;background:transparent;color:var(--ink);padding:7px 6px;border-radius:8px;cursor:pointer;min-height:36px;display:flex;align-items:center;justify-content:center;gap:6px}
.seg button svg{display:none}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 3px 8px rgba(0,0,0,.12),0 1px 1px rgba(0,0,0,.04)}
.guide{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:13px;padding:11px 13px;font-size:14px;margin:12px 0 6px}
.guide svg{font-size:18px;color:var(--accent);margin-top:2px}
.field{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:10px 0;border-bottom:.5px solid var(--line-2)}
.field:last-child{border-bottom:0;padding-bottom:0}
.lab{min-width:0;line-height:1.3;display:flex;flex-direction:column;gap:3px}
.lab b{font-size:15.5px;font-weight:500}
.lab>span{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sym{font-size:12.5px;font-weight:500;color:var(--faint);font-style:italic;font-family:"Times New Roman",Georgia,serif;letter-spacing:.02em}
.auto{display:none;font-size:11.5px;font-weight:600;color:var(--accent);font-style:normal}
.ctl{display:grid;grid-template-columns:36px 100px 36px;align-items:center;background:var(--sunken);border-radius:12px;padding:2px;transition:box-shadow .15s}
.ctl:focus-within{box-shadow:0 0 0 2px var(--accent)}
.ctl button{width:36px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--accent);cursor:pointer;display:grid;place-items:center;font-size:17px;touch-action:manipulation}
.ctl button:hover{background:#0071e314}
.ctl button:active{transform:scale(.9)}
.ctl .mid{display:flex;flex-direction:column;align-items:center;line-height:1.05}
.ctl input{font-family:var(--f-num);font-size:20px;font-weight:600;width:100%;min-width:0;border:0;background:transparent;color:var(--ink);padding:0 2px;text-align:center;letter-spacing:-.01em}
.ctl input:focus{outline:none}
.ctl .u{font-size:11px;color:var(--faint)}
.field.computed .ctl{background:var(--accent-soft)}
.field.computed.locked .ctl button{visibility:hidden}
.field.computed .ctl input{color:var(--accent-ink)}
.field.computed .auto{display:inline-block}
@media (max-width:400px){.ctl{grid-template-columns:32px 92px 32px}.ctl button{width:32px}.ctl input{font-size:18px}}

/* ===== 結果（大きな数字の読取カード） ===== */
.dro{background:var(--surface);color:var(--ink);border-radius:var(--r-card);padding:6px;display:grid;grid-template-columns:repeat(var(--cols,3),minmax(0,1fr));box-shadow:var(--shadow)}
.dro-cell{padding:16px 18px 18px;min-width:0;position:relative}
.dro-cell+.dro-cell::before{content:"";position:absolute;left:0;top:20px;bottom:20px;width:.5px;background:var(--line-2)}
.dro-k{display:flex;align-items:baseline;gap:6px;font-size:13.5px;font-weight:500;color:var(--muted)}
.dro-k i{font-style:italic;font-family:"Times New Roman",Georgia,serif;font-size:14px;color:var(--faint)}
.dro-v{font-family:var(--f-num);font-size:36px;font-weight:600;letter-spacing:-.02em;line-height:1.1;margin-top:8px;overflow-wrap:anywhere}
.dro-cell.lead .dro-v{font-size:48px;letter-spacing:-.03em}
.dro-cell.lead .dro-k{color:var(--ink);font-weight:600}
.dro-cell.calc .dro-v{color:var(--accent)}
.dro-cell.given .dro-v{color:var(--faint)}
.dro.c4 .dro-v,.dro.c4 .dro-cell.lead .dro-v{font-size:30px}
@media (min-width:701px){.dro:not(.c4):not(.err){grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) minmax(0,1fr)}}
.dro-v small{white-space:nowrap;display:inline-block;font-family:var(--f-body);font-size:14px;font-weight:500;color:var(--muted);margin-left:5px;letter-spacing:0}
.dro-s{font-size:13px;color:var(--muted);margin-top:6px}
.dro-s b{font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.dro.err{display:block;padding:20px 22px;font-size:15px;background:var(--danger-soft);box-shadow:none}
.dro.err b{color:var(--danger)}
@media (max-width:700px){
  .dro{grid-template-columns:minmax(0,1fr);padding:2px 4px}
  .dro-cell{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:2px 10px;padding:13px 14px}
  .dro-cell+.dro-cell::before{left:14px;right:0;top:0;bottom:auto;width:auto;height:.5px}
  .dro-v,.dro-cell.lead .dro-v,.dro.c4 .dro-v{font-size:26px;margin:0;text-align:right}
  .dro-cell.lead .dro-v{font-size:36px}
  .dro-s{grid-column:1/-1;margin-top:0}
}

/* ===== ゲージ ===== */
.gauge-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.gauge-head .h{margin:0}
.gauge-sub{font-size:14px;color:var(--muted);margin:0 0 22px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;padding:4px 11px;border-radius:99px;white-space:nowrap}
.pill svg{font-size:14px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.lo,.pill.hi{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.bar{position:relative;height:6px;border-radius:99px;background:var(--track);margin:28px 12px 0}
.bar .band{position:absolute;top:0;bottom:0;border-radius:99px;background:#34c759}
.bar .limit{position:absolute;top:0;bottom:0;right:0;border-radius:0 99px 99px 0;background:#ff3b30;opacity:.85}
.bar .knob{position:absolute;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:#fff;box-shadow:0 0 0 .5px rgba(0,0,0,.04),0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:left .25s ease}
.bar .tag{position:absolute;bottom:20px;transform:translateX(-50%);font-size:12.5px;font-weight:600;background:var(--ink);color:#fff;padding:2px 8px;border-radius:7px;white-space:nowrap;transition:left .25s ease;font-variant-numeric:tabular-nums}
.scale{position:relative;height:18px;margin:12px 12px 0;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.scale span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.scale .ok{color:var(--ok);font-weight:600}
.scale .dg{color:var(--danger);font-weight:600}
.gnote{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;margin:18px 0 0;padding-top:14px;border-top:.5px solid var(--line-2)}
.gnote span{color:var(--muted)}
.gnote b{font-weight:600;font-variant-numeric:tabular-nums}

/* ===== 図 ===== */
.diagram{border-radius:var(--r-card);padding:16px;overflow-x:auto;background:var(--surface);box-shadow:var(--shadow);position:relative}
.dcap{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:600;margin:0 0 8px}
.dcap svg{font-size:19px;color:var(--accent)}
.diagram>svg{display:block;width:100%;max-width:540px;margin:0 auto;height:auto;background-image:radial-gradient(var(--line) 1px,transparent 1.2px);background-size:18px 18px;border-radius:12px}
.diagram text{font-family:var(--f-num);font-size:14.5px;fill:var(--ink);font-weight:600}
.diagram .w{fill:var(--steel)} .diagram .w3{fill:var(--steel-2)} .diagram .w2{fill:var(--chip)}
.diagram .t{fill:var(--orange)}
.diagram .ln{stroke:#1d1d1f;stroke-width:1.2;fill:none;opacity:.35}
.diagram .dim{stroke:var(--faint);stroke-width:1;fill:none}
.diagram .mv{stroke:var(--accent);stroke-width:2.2;fill:none;stroke-linecap:round}
.diagram .mvt{fill:var(--accent)}
.diagram .edge{stroke:#1d1d1f;stroke-width:.8;stroke-opacity:.25}
.diagram .onw{fill:#ffffff}
.diagram .shape{fill:var(--accent);fill-opacity:.08;stroke:var(--accent);stroke-width:2}
.diagram .shape2{fill:none;stroke:var(--ink);stroke-width:1.5}
.diagram .hl{fill:var(--accent)}
.diagram .hls{stroke:var(--orange);stroke-width:3;fill:none;stroke-linecap:round}
.diagram .axis{stroke:var(--faint);stroke-width:1;stroke-dasharray:4 4}
.diagram .hole{fill:var(--surface);stroke:var(--ink);stroke-width:1.5}
.diagram .hole.first{fill:var(--orange);stroke:#c77700}
.diagram .small{font-size:12px;fill:var(--muted);font-weight:500}

/* ===== 表 ===== */
table.detail{width:100%;border-collapse:collapse}
table.detail th,table.detail td{padding:12px 0;border-bottom:.5px solid var(--line-2);vertical-align:middle}
table.detail tr:first-child th,table.detail tr:first-child td{padding-top:0}
table.detail tr:last-child th,table.detail tr:last-child td{border-bottom:0;padding-bottom:0}
table.detail th{text-align:left;font-weight:400;font-size:15.5px}
table.detail th .sym{margin-left:6px}

.tablewrap{overflow-x:auto}
details.formula summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}

.hint{font-size:13px;color:var(--muted);margin:12px 0 0}

/* ===== スマホ結果バー ===== */
.dock{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:25;background:#ffffffeb;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);color:var(--ink);padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));display:none;border-top:.5px solid #0000001f}
.dock-in{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr) auto;gap:10px;align-items:center;max-width:640px;margin:0 auto}
.dock-in div{min-width:0}
.dock-in span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
.dock-in b{display:block;font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock-in b small{font-family:var(--f-body);font-size:10.5px;font-weight:500;color:var(--muted);margin-left:2px;letter-spacing:0}
.dock-save{width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:20px;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:#34c759}.dot.lo,.dot.hi{background:#ff9500}.dot.danger{background:#ff3b30}
@media (max-width:959px){body.has-dock .dock{display:block}}

/* ===== 電卓（iOS 電卓風） ===== */
.cgrid{display:grid;grid-template-columns:minmax(0,400px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1060px){.cgrid{grid-template-columns:minmax(0,1fr)}}
.calcbody{background:var(--calc-dark);border-radius:28px;padding:18px 16px 16px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.calcbody .hint{color:#8e8e93}
.screen{color:#fff;padding:12px 10px 16px;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:2px}
.screen .expr{font-family:var(--f-num);font-size:18px;color:#8e8e93;overflow-wrap:anywhere;text-align:right;min-height:1.4em}
.screen .res{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:58px;font-weight:300;letter-spacing:-.02em;overflow-wrap:anywhere;text-align:right;line-height:1.05}
.screen .res.err{font-family:var(--f-body);font-size:17px;font-weight:500;color:var(--orange)}
.keys{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.keys button{font-family:var(--f-num);font-size:26px;font-weight:400;aspect-ratio:1;max-width:100%;border-radius:50%;border:0;background:var(--calc-key);color:#fff;cursor:pointer;touch-action:manipulation;display:grid;place-items:center;transition:filter .1s}
.keys button:hover{filter:brightness(1.15)}
.keys button:active{filter:brightness(1.4)}
.keys .op,.keys .eq{background:var(--orange);color:#fff;font-size:30px}
.keys .fn{background:var(--calc-fn);color:#000;font-size:20px;font-weight:500}
.keys .fn svg{font-size:24px}
.keys .clr{color:#000}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;max-height:340px;overflow:auto}
.hist li{display:flex;align-items:center;gap:6px;border-bottom:.5px solid var(--line-2)}
.hist li:last-child{border-bottom:0}
.hist .hb{all:unset;box-sizing:border-box;flex:1;min-width:0;display:flex;justify-content:space-between;gap:10px;padding:11px 6px;font-size:15px;cursor:pointer;border-radius:8px;font-variant-numeric:tabular-nums}
.hist .hb:hover{background:var(--sunken)}
.hist .hb:focus-visible{outline:2px solid var(--accent)}
.hist .e{color:var(--muted);overflow-wrap:anywhere;min-width:0}
.hist .r{font-weight:600;white-space:nowrap}
.iconbtn{width:36px;height:36px;flex:none;border:0;border-radius:50%;background:transparent;color:var(--accent);display:grid;place-items:center;font-size:19px;cursor:pointer}

.iconbtn.on{color:#ff9f0a}
.iconbtn.on svg{fill:#ff9f0a}

.inbox{display:flex;align-items:center;border-radius:12px;background:var(--sunken);overflow:hidden;min-width:0;transition:box-shadow .15s}

.inbox input{font-family:var(--f-num);font-size:20px;font-weight:600;width:100%;min-width:0;border:0;background:transparent;color:var(--ink);padding:10px 12px;text-align:right;font-variant-numeric:tabular-nums}
.inbox input:focus{outline:none}
.inbox .u{font-size:13px;color:var(--muted);padding:0 12px 0 2px;white-space:nowrap}
.dms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:10px}

/* ===== 単位変換 ===== */
.ugrid{display:grid;grid-template-columns:minmax(0,330px) minmax(0,1fr);gap:20px;align-items:start}

.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}

@media (max-width:520px){.urow,.ures{grid-template-columns:minmax(0,1fr)}}
.inbox.big input{font-size:32px;padding:8px 14px;text-align:left;letter-spacing:-.02em}

.ufoot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px;padding-top:12px;border-top:.5px solid var(--line-2);font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* ===== 記録ノート ===== */
.ngrid{display:grid;grid-template-columns:minmax(0,350px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1060px){.ngrid{grid-template-columns:minmax(0,1fr)}}
.ngrid>.stack:first-child{position:sticky;top:24px}
@media (max-width:1060px){.ngrid>.stack:first-child{position:static}}
.store{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:99px;background:var(--fill);color:var(--muted)}
.store svg{font-size:14px}
.store.cloud{background:var(--ok-soft);color:var(--ok)}
.store.wait{background:var(--amber-soft);color:var(--amber-ink)}
.ta{position:relative}
textarea{font:inherit;font-size:16px;line-height:1.6;width:100%;min-height:112px;resize:vertical;border:0;border-radius:13px;background:var(--sunken);color:var(--ink);padding:12px 50px 12px 14px}
textarea:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
.mic{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);color:var(--accent);display:grid;place-items:center;font-size:19px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mic.live{background:#ff3b30;color:#fff;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px #ff3b3033}}
.tin{font:inherit;font-size:15px;width:100%;border:0;border-radius:11px;background:var(--sunken);color:var(--ink);padding:10px 13px;min-height:44px}
.tin:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
.flabel{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tagbtn{display:inline-flex;align-items:center;gap:5px;border:0;background:var(--sunken);color:var(--ink);border-radius:99px;padding:6px 13px;font-size:13.5px;font-weight:500;cursor:pointer}
.tagbtn:hover{background:var(--track)}
.tg-try[aria-pressed="true"],.chip.tg-try{background:#e8f1fc;color:#0066cc}
.tg-mass[aria-pressed="true"],.chip.tg-mass{background:#e3f6ea;color:#1f8a4c}
.tg-check[aria-pressed="true"],.chip.tg-check{background:#fff3e0;color:#b35c00}
.tg-bad[aria-pressed="true"],.chip.tg-bad{background:#ffe9e7;color:#d70015}
.tg-good[aria-pressed="true"],.chip.tg-good{background:#e3f6ea;color:#1f8a4c}
.tg-x[aria-pressed="true"],.chip.tg-x{background:var(--track);color:var(--ink)}
.tagbtn[aria-pressed="true"]{font-weight:600;box-shadow:inset 0 0 0 1.5px currentColor}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--track);color:var(--muted)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{flex:1 1 220px;position:relative;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:17px;color:var(--faint)}
.search input{padding-left:36px}
.toolbar .selbox{flex:0 1 170px}
.daygroup{display:flex;flex-direction:column;gap:10px}
.dayh{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-top:8px;display:flex;align-items:baseline;gap:8px}
.dayh small{font-size:13px;font-weight:500;color:var(--faint)}
.entry{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 14px;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--shadow);padding:16px 18px}
.entry.pinned{box-shadow:var(--shadow),inset 0 0 0 1.5px #ff9f0a}
.e-time{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}

.e-body{min-width:0;display:flex;flex-direction:column;gap:8px}
.e-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0}
.e-kind{font-size:13px;font-weight:500;color:var(--muted)}
.e-part{font-size:17px;font-weight:600;overflow-wrap:anywhere}
.e-mach{font-size:14px;color:var(--muted)}
.e-head .iconbtn{margin-left:auto}
.e-cells{display:flex;flex-wrap:wrap;gap:6px 22px;background:var(--sunken);color:var(--ink);border-radius:13px;padding:10px 14px}
.e-cells div{display:flex;flex-direction:column;min-width:0}
.e-cells span{font-size:12px;color:var(--muted)}
.e-cells b{font-family:var(--f-num);font-size:19px;font-weight:600;white-space:nowrap;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.e-cells b small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:400;margin-left:3px;letter-spacing:0}
.e-memo{margin:0;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.e-actions{display:flex;gap:2px;flex-wrap:wrap;margin:2px -10px 0}
.e-more{font-size:13.5px;color:var(--muted)}
.e-more summary{cursor:pointer;color:var(--accent-ink)}
.e-more ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.confirm{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--danger-soft);border-radius:12px;padding:8px 12px;font-size:14px;color:var(--danger);font-weight:600}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:16px;padding:12px 16px;font-size:14.5px}
.banner svg{font-size:20px;color:var(--accent)}
.estate{text-align:center;padding:44px 16px;color:var(--muted)}
.estate svg{font-size:48px;color:var(--line-2);margin-bottom:10px}
.estate b{display:block;color:var(--ink);font-size:18px;font-weight:600;margin-bottom:4px}
.count{font-weight:600;font-variant-numeric:tabular-nums}

/* ===== シート・トースト ===== */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.32);display:flex;align-items:flex-end;justify-content:center;padding:20px;padding-bottom:max(20px,env(safe-area-inset-bottom,0px))}

.sheet-h{display:flex;align-items:center;gap:12px;padding:18px 20px 12px;position:sticky;top:0;background:var(--bg);z-index:1}

.sheet-b .tin,.sheet-b textarea,.sheet-b .tagbtn{background:var(--surface)}

.toast{position:fixed;left:50%;bottom:calc(var(--navh) + 24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:70;background:#1d1d1fee;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:99px;font-size:14.5px;font-weight:500;display:flex;align-items:center;gap:10px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px)}

.foot{margin-top:28px;font-size:12.5px;color:var(--faint);display:flex;gap:8px;align-items:flex-start}
.foot svg{font-size:15px;margin-top:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<body>
<div class="app">
  <aside class="side" aria-label="メニュー">

</div>

const PI=Math.PI, rad=d=>d*PI/180, deg=r=>r*180/PI;
function fmt(v,d){ if(!isFinite(v)) return "—"; return v.toLocaleString("ja-JP",{minimumFractionDigits:d,maximumFractionDigits:d}); }
function fmtTime(min){
  if(!isFinite(min)||min<=0) return ["—",""];
  const s=Math.round(min*60);
  if(s<60) return [String(s),"秒"];
  const m=Math.floor(s/60), r=s%60;
  if(m<60) return [m+"分"+String(r).padStart(2,"0"),"秒"];
  return [Math.floor(m/60)+"時間"+String(m%60).padStart(2,"0"),"分"];
}
function dms(d){
  if(!isFinite(d)) return "—";
  const sg=d<0?"−":""; d=Math.abs(d);
  let D=Math.floor(d), M=Math.floor((d-D)*60), S=Math.round(((d-D)*60-M)*60);
  if(S===60){S=0;M++;} if(M===60){M=0;D++;}
  return `${sg}${D}°${String(M).padStart(2,"0")}′${String(S).padStart(2,"0")}″`;
}
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function cutGauge(key,s){
  const m=MATS[S.mat]; let lo,hi;

  const nlo=1000*lo/(PI*s.D), nhi=1000*hi/(PI*s.D);
  return {title:"切削速度の目安",sub:m.name+" ・ "+(key==="tap"?"ハイスタップ":S.tool==="carb"?"超硬工具":"ハイス工具"),

  tri:{group:"geo",name:"直角三角形",title:"直角三角形",desc:"わかっている2つの値から、残りの辺と角度を求めます",
    guide:"わかっている値を<b>2つ</b>入れてください。最後に入れた2つを基準に、残りを自動で計算します。",
    editableAuto:true,
    fields:()=>[["a","底辺","a","mm",1],["b","高さ","b","mm",1],["c","斜辺","c","mm",1],["A","角度（底辺と斜辺）","θ","°",.5]],
    onInput(s,id){ if(!s.known.includes(id)) s.known=[s.known[s.known.length-1],id]; },
    compute(s){
      const k=s.known.slice().sort().join(""), A=rad(s.A); let err="";
      const ok=x=>isFinite(x)&&x>0;
      switch(k){
        case "ab": s.c=Math.hypot(s.a,s.b); s.A=deg(Math.atan2(s.b,s.a)); break;
        case "ac": if(s.c<=s.a) err="斜辺は底辺より長くしてください"; else { s.b=Math.sqrt(s.c*s.c-s.a*s.a); s.A=deg(Math.acos(s.a/s.c)); } break;
        case "bc": if(s.c<=s.b) err="斜辺は高さより長くしてください"; else { s.a=Math.sqrt(s.c*s.c-s.b*s.b); s.A=deg(Math.asin(s.b/s.c)); } break;
        case "Aa": if(!(s.A>0&&s.A<90)) err="角度は0°より大きく90°未満にしてください"; else { s.b=s.a*Math.tan(A); s.c=s.a/Math.cos(A); } break;
        case "Ab": if(!(s.A>0&&s.A<90)) err="角度は0°より大きく90°未満にしてください"; else { s.a=s.b/Math.tan(A); s.c=s.b/Math.sin(A); } break;
        case "Ac": if(!(s.A>0&&s.A<90)) err="角度は0°より大きく90°未満にしてください"; else { s.a=s.c*Math.cos(A); s.b=s.c*Math.sin(A); } break;
      }
      if(!err&&!(ok(s.a)&&ok(s.b)&&ok(s.c))) err="0より大きい値を入れてください";
      const auto=["a","b","c","A"].filter(x=>!s.known.includes(x));
      const cell=(id,k,sym,v,u,sub)=>({k,sym,v,u,s:sub,auto:auto.includes(id),given:!auto.includes(id)});
      return {err,auto,cols:4,cells:[cell("a","底辺","a",fmt(s.a,3),"mm"),cell("b","高さ","b",fmt(s.b,3),"mm"),cell("c","斜辺","c",fmt(s.c,3),"mm"),cell("A","角度","θ",fmt(s.A,3),"°",dms(s.A))],
        rows:[["角度（度分秒）","θ",dms(s.A),""],["反対側の角度","90°−θ",fmt(90-s.A,3),"°",dms(90-s.A)],["勾配（高さ ÷ 底辺）","tanθ",fmt(s.b/s.a,4),"","100mmあたり "+fmt(s.b/s.a*100,2)+" mm"],["面積","",fmt(s.a*s.b/2,2),"mm²"]]};
    },
    diagram(s,r){
      if(r.err) return emptyDiagram();
      const W=520,H=250, pad=50, sc=Math.min((W-2*pad-40)/s.a,(H-2*pad)/s.b);
      const x0=pad+20, y0=H-pad+10, x1=x0+s.a*sc, y1=y0-s.b*sc;
      const hl=id=>r.auto.includes(id)?' class="hl"':'';
      const ar=Math.min(40,s.a*sc*.4);
      return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="直角三角形の図">
        <path d="M${x0} ${y0} L${x1} ${y0} L${x1} ${y1} Z" class="shape"/>
        <path d="M${x1-14} ${y0} v-14 h14" class="shape2"/>
        <path d="M${x0+ar} ${y0} A${ar} ${ar} 0 0 0 ${x0+ar*Math.cos(rad(s.A))} ${y0-ar*Math.sin(rad(s.A))}" class="hls"/>
        <text x="${(x0+x1)/2}" y="${y0+26}" text-anchor="middle"${hl("a")}>a = ${fmt(s.a,2)}</text>
        <text x="${x1+10}" y="${(y0+y1)/2}" ${hl("b")}>b = ${fmt(s.b,2)}</text>
        <text x="${(x0+x1)/2-14}" y="${(y0+y1)/2-12}" text-anchor="end"${hl("c")}>c = ${fmt(s.c,2)}</text>
        <text x="${x0+ar+8}" y="${y0-8}"${hl("A")}>θ ${fmt(s.A,2)}°</text>
      </svg>`;
    },
    formulas:["c = √(a² + b²)","a = c × cosθ　　b = c × sinθ","b = a × tanθ","θ = tan⁻¹(b ÷ a)"]},
  taper:{group:"geo",name:"テーパー",title:"テーパー",desc:"大径・小径・長さからテーパー角度と刃物台の旋回角を求めます",
    seg:[["angle","角度を求める","angle"],["d","小径を求める","ruler"]],
    fields:(s)=> s.mode==="angle"

      : [["D","大径","D","mm",1],["L","テーパー長さ","L","mm",1],["ang","テーパー角（全角）","2α","°",.5]],
    compute(s){
      let err="";
      if(s.mode==="angle"){ if(!(s.D>s.d)) err="大径は小径より大きくしてください"; s.ang=2*deg(Math.atan((s.D-s.d)/(2*s.L))); }
      else { s.d=s.D-2*s.L*Math.tan(rad(s.ang/2)); if(!(s.ang>0&&s.ang<180)) err="角度は0°より大きく180°未満にしてください"; else if(s.d<0) err="この角度と長さでは小径がマイナスになります"; }
      const a=s.ang/2, ratio=s.L/(s.D-s.d);
      const c=s.mode==="angle"
        ? [{k:"テーパー角（全角）",sym:"2α",v:fmt(s.ang,3),u:"°",s:dms(s.ang),lead:1,auto:1},{k:"刃物台の旋回角",sym:"α",v:fmt(a,3),u:"°",s:dms(a)},{k:"テーパー比",sym:"1:x",v:"1 : "+fmt(ratio,2),u:"",s:"直径差1mmあたりの長さ"}]
        : [{k:"小径",sym:"d",v:fmt(s.d,3),u:"mm",lead:1,auto:1},{k:"刃物台の旋回角",sym:"α",v:fmt(a,3),u:"°",s:dms(a)},{k:"テーパー比",sym:"1:x",v:"1 : "+fmt(ratio,2),u:""}];
      return {err,auto:[],cells:c,rows:[["片側の段差","(D−d)/2",fmt((s.D-s.d)/2,3),"mm"],["勾配（片側）","tanα",fmt(Math.tan(rad(a)),5),""],["長さ100mmあたりの直径差","",fmt((s.D-s.d)/s.L*100,3),"mm"]]};
    },
    diagram(s,r){

        <path d="M${cx} ${cy-hD} L${cx+len} ${cy-hd} L${cx+len} ${cy+hd} L${cx} ${cy+hD} Z" class="shape"/>
        <path d="M${cx} ${cy-hD} L${cx+len} ${cy-hD}" class="axis"/>
        <path d="M${cx+len-70} ${cy-hD} A70 70 0 0 1 ${cx+len-70*Math.cos(Math.atan((hD-hd)/len))} ${cy-hD+70*Math.sin(Math.atan((hD-hd)/len))}" class="hls"/>
        <text x="${cx-8}" y="${cy-hD-10}">D ${fmt(s.D,2)}</text>

        <text x="${cx+len/2}" y="${cy+hD+28}" text-anchor="middle">L ${fmt(s.L,1)}</text>
        <text x="${cx+len-80}" y="${cy-hD-10}" text-anchor="end" class="hl">α ${fmt(s.ang/2,2)}°</text>
      </svg>`;
    },
    formulas:["α = tan⁻¹((D − d) ÷ 2L)　（刃物台の旋回角）","テーパー角（全角）= 2α","d = D − 2L × tanα","テーパー比 = 1 : L ÷ (D − d)"]},
  pcd:{group:"geo",name:"PCD穴位置",title:"PCD（ピッチ円）の穴位置",desc:"ピッチ円径と穴数から各穴の X・Y 座標を求めます",
    fields:()=>[["P","ピッチ円径","PCD","mm",5],["N","穴数","N","個",1,{int:1,min:1,max:72}],["s0","1番穴の角度","θ₀","°",15],["x0","中心 X","X₀","mm",1,{neg:1}],["y0","中心 Y","Y₀","mm",1,{neg:1}]],

        rows:[],pts,extra:`<div class="card"><h2 class="h">${ICON.table}穴の座標（反時計回り・X軸から）</h2><div class="tablewrap"><table class="ref"><thead><tr><th>穴</th><th>角度</th><th>X</th><th>Y</th></tr></thead><tbody>${pts.map(p=>`<tr${p[0]===1?' class="on"':''}><td>No.${p[0]}</td><td>${fmt(p[1]%360,2)}°</td><td>${fmt(p[2],3)}</td><td>${fmt(p[3],3)}</td></tr>`).join("")}</tbody></table></div></div>`};

    formulas:["X = X₀ + (PCD ÷ 2) × cos(θ₀ + i × 360/N)","Y = Y₀ + (PCD ÷ 2) × sin(θ₀ + i × 360/N)","穴の間隔（弦）= PCD × sin(180° ÷ N)"]},
  sine:{group:"geo",name:"サインバー",title:"サインバー",desc:"角度からブロックゲージの高さ、または高さから角度を求めます",

  arc:{group:"geo",name:"円弧・弦",title:"円弧・弦",desc:"半径と中心角から弦長・弧長・高さを、または弦と高さから半径を求めます",
    seg:[["ra","Rと角度から","angle"],["ch","弦と高さからR","ruler"]],

    compute(s){

      else { if(!(s.h>0&&s.c>0)) err="0より大きい値を入れてください"; s.R=(s.c*s.c/4+s.h*s.h)/(2*s.h); s.th=2*deg(Math.asin(Math.min(1,s.c/(2*s.R)))); if(s.h>s.R) s.th=360-s.th; }
      const arc=s.R*rad(s.th);

      return {err,auto:[],cells:c,rows:[["直径","2R",fmt(2*s.R,3),"mm"],["扇形の面積","",fmt(s.R*s.R*rad(s.th)/2,2),"mm²"]]};

    diagram(s,r){

      const p1=[cx+Rp*Math.cos(a1),cy-Rp*Math.sin(a1)], p2=[cx+Rp*Math.cos(a2),cy-Rp*Math.sin(a2)];
      const top=cy-Rp, large=th>180?1:0;
      return `<svg viewBox="0 0 ${W} ${Math.max(H,cy+30)}" role="img" aria-label="円弧と弦の図">

        <line x1="${cx}" y1="${cy}" x2="${p1[0]}" y2="${p1[1]}" class="axis"/><line x1="${cx}" y1="${cy}" x2="${p2[0]}" y2="${p2[1]}" class="axis"/>
        <line x1="${cx}" y1="${top}" x2="${cx}" y2="${(p1[1])}" stroke="var(--warn)" stroke-width="2"/>
        <circle cx="${cx}" cy="${cy}" r="3" fill="var(--ink)"/>
        <text x="${cx+8}" y="${(top+p1[1])/2+5}">h ${fmt(s.h,2)}</text>

const RES={};
function fieldDef(id,fid){ return TOOLS[id].fields(S.t[id]).find(f=>f[0]===fid); }
function syncPanel(id,auto){
  const T=TOOLS[id], s=S.t[id], p=$("panel-"+id);
  T.fields(s).forEach(([fid,,,,st,o])=>{
    const el=p.querySelector(`input[data-fid="${fid}"]`); if(!el) return;
    const d=(o&&o.int)?0:Math.max(dec(st),fid==="n"||fid==="Ns"?0:3);
    const v=+(+s[fid]).toFixed(d);
    if(document.activeElement!==el) el.value=isFinite(v)?v:"";
    const comp=auto.includes(fid), f=el.closest(".field");

    el.readOnly=comp&&!T.editableAuto;

  const m=p.querySelector('[data-role="mat"]'); if(m) m.value=S.mat;
  const t=p.querySelector('[data-role="tool"]'); if(t) t.value=S.tool;

  const ms=p.querySelector('[data-role="msize"]'); if(ms){ const v=s.D+"|"+s.P; ms.value=[...ms.options].some(o=>o.value===v)?v:""; }

function renderAll(){ Object.keys(TOOLS).forEach(renderTool); }

function bindTool(id){
  const v=$("view-"+id), T=TOOLS[id];
  v.addEventListener("input",e=>{
    const t=e.target; if(t.tagName!=="INPUT"||!t.dataset.fid) return;
    const fid=t.dataset.fid, def=fieldDef(id,fid), o=(def&&def[5])||{}; let x=parseFloat(t.value);
    if(!isFinite(x)) return; if(x<0&&!o.neg) return;
    if(o.int) x=Math.round(x);
    S.t[id][fid]=x; T.onInput&&T.onInput(S.t[id],fid); renderTool(id);
  });
  v.addEventListener("change",e=>{
    const t=e.target, role=t.dataset.role;
    if(role==="mat"){ S.mat=t.value; ["turn","mill","drill","tap"].forEach(renderTool); }
    else if(role==="tool"){ S.tool=t.value; ["turn","mill","drill"].forEach(renderTool); }
    else if(role==="wheel"){ S.wheel=+t.value; renderTool("grind"); }
    else if(role==="msize"&&t.value){ const [d,p]=t.value.split("|").map(Number); S.t.tap.D=d; S.t.tap.P=p; renderTool("tap"); }
    else if(t.dataset.fid) renderTool(id);
  });
  v.addEventListener("click",e=>{
    const sb=e.target.closest("button[data-step]");
    if(sb){ const fid=sb.closest(".field").querySelector("input").dataset.fid, def=fieldDef(id,fid), o=def[5]||{}, st=parseFloat(sb.dataset.step);
      let x=+((+S.t[id][fid]||0)+st).toFixed(Math.max(dec(Math.abs(st)),4));
      if(!o.neg) x=Math.max(0,x); if(o.int) x=Math.max(o.min||1,Math.round(x)); if(o.max) x=Math.min(o.max,x);
      S.t[id][fid]=x; T.onInput&&T.onInput(S.t[id],fid); renderTool(id); return; }
    const sg=e.target.closest("button[data-seg]");
    if(sg){ S.t[id][T.segKey||"mode"]=sg.dataset.seg; buildPanel(id); renderTool(id); return; }
    const rs=e.target.closest("[data-reset]");
    if(rs){ S.t[id]=clone(DEF.t[id]); buildPanel(id); renderTool(id); toast("初期値に戻しました"); return; }
    const sv=e.target.closest("[data-save]"); if(sv){ openSave(recordFromTool(id)); return; }
    const tr=e.target.closest("#tap-table tr[data-d]"); if(tr){ S.t.tap.D=+tr.dataset.d; S.t.tap.P=+tr.dataset.p; renderTool("tap"); }
  });
  v.addEventListener("keydown",e=>{ const tr=e.target.closest("#tap-table tr[data-d]"); if(tr&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); tr.click(); } });
}

function renderDock(){
  const r=RES[S.route], el=$("dock-in");
  const on=!!(r&&TOOLS[S.route]);

let expr="", hist=lsGet("cutcalc-hist",[]), justEval=false;
if(!Array.isArray(hist)) hist=[];
function tokenize(s){
  const out=[]; let i=0;
  while(i<s.length){
    const c=s[i];
    if(/\s/.test(c)){i++;continue;}
    if(/[0-9.]/.test(c)){ let j=i; while(j<s.length&&/[0-9.e]/.test(s[j])&&!(s[j]==="e"&&!/[0-9]/.test(s[j+1]||""))) j++; const t=s.slice(i,j); if((t.match(/\./g)||[]).length>1) throw Error("小数点が多すぎます"); out.push({t:"n",v:parseFloat(t)}); i=j; continue; }
    if("+-−×*÷/^()√π%²".includes(c)){ out.push({t:c==="*"?"×":c==="/"?"÷":c==="-"?"−":c}); i++; continue; }
    throw Error("使えない文字があります");
  }
  return out;
}
function parse(tokens){
  let p=0; const peek=()=>tokens[p], eat=()=>tokens[p++];
  const sp=t=>t&&(t.t==="n"||t.t==="π"||t.t==="√"||t.t==="(");
  function ex(){ let v=term(); while(peek()&&(peek().t==="+"||peek().t==="−")){ const o=eat().t, r=term(); v=o==="+"?v+r:v-r; } return v; }
  function term(){ let v=un(); for(;;){ const t=peek(); if(t&&(t.t==="×"||t.t==="÷")){ eat(); const r=un(); if(t.t==="÷"&&r===0) throw Error("0では割れません"); v=t.t==="×"?v*r:v/r; } else if(sp(t)){ v*=un(); } else break; } return v; }
  function un(){ if(peek()&&peek().t==="−"){eat();return -un();} if(peek()&&peek().t==="+"){eat();return un();} return pw(); }
  function pw(){ const b=pf(); if(peek()&&peek().t==="^"){ eat(); return Math.pow(b,un()); } return b; }
  function pf(){ let v=pr(); while(peek()&&(peek().t==="%"||peek().t==="²")){ v=eat().t==="%"?v/100:v*v; } return v; }
  function pr(){ const t=eat(); if(!t) throw Error("式が途中で終わっています");
    if(t.t==="n") return t.v; if(t.t==="π") return PI;
    if(t.t==="√"){ const v=pf(); if(v<0) throw Error("負の数の平方根は求められません"); return Math.sqrt(v); }
    if(t.t==="("){ const v=ex(); if(peek()&&peek().t===")") eat(); return v; }
    throw Error("式の形が正しくありません"); }
  const v=ex(); if(p<tokens.length) throw Error("式の形が正しくありません"); return v;
}
const evaluate=s=>{ const v=parse(tokenize(s)); if(!isFinite(v)) throw Error("計算できません"); return v; };
const numStr=v=>(Math.abs(v)>=1e12||(Math.abs(v)<1e-6&&v!==0))?v.toExponential(6):String(+v.toPrecision(12));
function fitRes(){ const el=$("c-res"), n=el.textContent.length; el.style.fontSize=el.classList.contains("err")?"":n>17?"28px":n>14?"34px":n>11?"42px":n>8?"50px":""; }
const show=r=>/e/.test(r)?r:Number(r).toLocaleString("ja-JP",{maximumFractionDigits:10});
function showCalc(){

}
function renderHist(){

function press(k){
  const isOp="+−×÷^".includes(k);
  if(justEval&&!isOp&&!["=","BS","%","²","NEG"].includes(k)) expr="";
  justEval=false;
  if(k==="C") expr="";
  else if(k==="BS") expr=expr.slice(0,-1);
  else if(k==="NEG") expr=expr?(expr.startsWith("−(")&&expr.endsWith(")")?expr.slice(2,-1):"−("+expr+")"):"−";
  else if(k==="="){
    if(!expr) return;
    try{ const r=numStr(evaluate(expr)); hist.unshift({e:expr,r,at:Date.now()}); hist=hist.slice(0,50); lsSet("cutcalc-hist",hist);
      $("c-expr").textContent=expr+" ="; expr=r; $("c-res").classList.remove("err"); $("c-res").textContent=show(r); fitRes(); justEval=true; renderHist(); return;
    }catch(e){ $("c-res").textContent=e.message; $("c-res").classList.add("err"); $("c-expr").textContent=expr; return; }
  }
  else expr+=k;
  showCalc();
}

  const dd=$("dm-d"), dm=$("dm-m"), ds=$("dm-s"), dx=$("dm-dec");

  [dd,dm,ds].forEach(x=>x.addEventListener("input",fromDMS)); dx.addEventListener("input",toDMS);

const Store={mode:"local",state:"ready",items:[],col:null,unsub:null,listeners:[]};
function localItems(){ const a=lsGet("cutcalc-notes",[]); return Array.isArray(a)?a:[]; }
function setLocal(items){ lsSet("cutcalc-notes",items); }
function emit(){ Store.listeners.forEach(f=>f()); }
Store.items=localItems();
async function initStore(){
  if(!(window.claude&&typeof window.claude.use==="function")) return;
  try{
    const [db,user]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!db||!user) return;
    const uid=await user.id(); if(!uid) return;
    const can=await (user.can?user.can("data.write"):Promise.resolve(null));
    if(can===false) return;
    Store.col=db.collection("data/users/"+uid);
    Store.mode="cloud"; Store.state="loading"; Store.items=[]; emit();
    const timer=setTimeout(()=>{ if(Store.state==="loading"){ Store.state="slow"; emit(); } },10000);
    Store.unsub=Store.col.orderBy("at","desc").limit(1000).onSnapshot(snap=>{
      Store.items=snap.docs.map(d=>Object.assign({},d.data(),{id:d.id}));
      if(!snap.metadata.fromCache){ clearTimeout(timer); Store.state="ready"; }
      emit();
    },err=>{ clearTimeout(timer); Store.mode="local"; Store.state="ready"; Store.items=localItems(); emit(); toast("アカウントの記録に接続できないため、この端末に保存します"); });
  }catch(e){}
}
function newId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
async function storeAdd(rec){
  rec.id=rec.id||newId();
  if(Store.mode==="cloud"){
    const {id,...body}=rec;
    try{ await Store.col.doc(id).set(body); return true; }
    catch(e){ if(e&&e.code==="quota_exceeded"){ toast("保存できる件数の上限です。古い記録を削除してください"); return false; }
      Store.mode="local"; Store.items=localItems(); emit(); toast("アカウントに保存できないため、この端末に保存しました"); }
  }
  const items=localItems(); items.unshift(rec); setLocal(items); Store.items=items; emit(); return true;
}
async function storeUpdate(id,patch){
  if(Store.mode==="cloud"){ try{ await Store.col.doc(id).update(patch); return; }catch(e){ toast("更新できませんでした。もう一度お試しください"); return; } }
  const items=localItems().map(x=>x.id===id?Object.assign({},x,patch):x); setLocal(items); Store.items=items; emit();
}
async function storeRemove(id){
  if(Store.mode==="cloud"){ try{ await Store.col.doc(id).delete(); return; }catch(e){ toast("削除できませんでした。もう一度お試しください"); return; } }
  const items=localItems().filter(x=>x.id!==id); setLocal(items); Store.items=items; emit();
}
async function migrateLocal(){
  const loc=localItems(); if(!loc.length||Store.mode!=="cloud") return;
  let n=0; for(const r of loc){ const {id,...body}=r; try{ await Store.col.doc(id||newId()).set(body); n++; }catch(e){ break; } }
  if(n===loc.length) setLocal([]);
  toast(n+"件をアカウントに移しました"); renderNotes();
}
function storeBadge(){
  if(Store.mode==="cloud"&&Store.state!=="ready") return `<span class="store wait">${ICON.cloud}${Store.state==="slow"?"接続を待っています":"読み込み中"}</span>`;
  return Store.mode==="cloud"?`<span class="store cloud">${ICON.cloud}アカウントに保存</span>`:`<span class="store">${ICON.device}この端末に保存</span>`;

function recordFromTool(id){
  const T=TOOLS[id], s=S.t[id], r=RES[id];

  const ctx={}; if(T.selects==="matTool"){ ctx.mat=S.mat; ctx.tool=S.tool; } if(T.selects==="matTap") ctx.mat=S.mat; if(T.selects==="wheel") ctx.wheel=S.wheel;
  let title=T.name; const segv=T.seg?(T.seg.find(x=>x[0]===s[T.segKey||"mode"])||[])[1]:""; if(id==="grind") title=segv;

  const fieldsText=T.fields(s).map(([fid,lab,sym,u])=>[lab,fmt(+s[fid],Math.abs(s[fid])>=100?1:3).replace(/\.?0+$/,""),u]);
  return {kind:id,title,cond:cond.join("・"),
    cells:r.err?[["エラー",r.err,""]]:r.cells.map(c=>[c.k,plain(c.v),c.u||""]),
    rows:(r.err?[]:r.rows.map(x=>[x[0],plain(x[2]),x[3]||""])).concat(fieldsText.map(x=>["入力："+x[0],x[1],x[2]])),

}

function bindNotes(){

  v.addEventListener("change",e=>{ if(e.target.id==="n-kind"){ NF.kind=e.target.value; renderNotes(); } });
  v.addEventListener("click",async e=>{
    const t=e.target;

    if(t.closest("#n-pin")){ NF.pin=!NF.pin; renderNotes(); return; }
    if(t.closest("#m-go")){ migrateLocal(); return; }
    if(t.closest("#q-add")){
      const memo=$("q-memo").value.trim(); if(!memo){ toast("メモを入力してください"); $("q-memo").focus(); return; }
      const tags=[...$("n-left").querySelectorAll('[data-tags="quick"] [aria-pressed="true"]')].map(b=>b.dataset.tag);
      const ok=await storeAdd({kind:"memo",title:"メモ",memo,part:$("q-part").value.trim(),machine:$("q-mach").value.trim(),tags,pin:false,at:Date.now(),cells:[],rows:[]});
      if(ok){ $("q-memo").value=""; $("n-left").querySelectorAll('[data-tags="quick"] [data-tag]').forEach(b=>b.setAttribute("aria-pressed","false")); toast("メモを追加しました"); }
      return;
    }
    if(t.closest("#x-csv")){ exportCSV(); return; }
    if(t.closest("#x-copy")){ exportText(); return; }
    const pin=t.closest("[data-pin]"); if(pin){ const x=Store.items.find(i=>i.id===pin.dataset.pin); if(x) storeUpdate(x.id,{pin:!x.pin}); return; }
    const ed=t.closest("[data-edit]"); if(ed){ editing=ed.dataset.edit; confirming=null; renderNotes(); setTimeout(()=>{const m=$("ed-memo"); if(m) m.focus();},20); return; }
    if(t.closest("[data-edcancel]")){ editing=null; renderNotes(); return; }
    const es=t.closest("[data-edsave]"); if(es){
      const tags=[...v.querySelectorAll('[data-tags="edit"] [aria-pressed="true"]')].map(b=>b.dataset.tag);
      const patch={part:$("ed-part").value.trim(),machine:$("ed-mach").value.trim(),memo:$("ed-memo").value.trim(),tags};
      editing=null; await storeUpdate(es.dataset.edsave,patch); renderNotes(); toast("記録を更新しました"); return; }
    const del=t.closest("[data-del]"); if(del){ confirming=del.dataset.del; editing=null; renderNotes(); return; }
    if(t.closest("[data-delno]")){ confirming=null; renderNotes(); return; }
    const dok=t.closest("[data-delok]"); if(dok){ confirming=null; await storeRemove(dok.dataset.delok); renderNotes(); toast("削除しました"); return; }
    const rs=t.closest("[data-restore]"); if(rs){
      const x=Store.items.find(i=>i.id===rs.dataset.restore); if(!x) return;
      if(x.kind==="units"){ S.units=merge(DEF.units,x.inputs||{}); renderUnits(); go("units",true); toast("記録した換算を呼び出しました"); return; }
      if(!TOOLS[x.kind]) return;

      if(x.ctx){ if(x.ctx.mat) S.mat=x.ctx.mat; if(x.ctx.tool) S.tool=x.ctx.tool; if(x.ctx.wheel) S.wheel=x.ctx.wheel; }
      buildPanel(x.kind); renderAll(); go(x.kind,true); toast("記録した条件を呼び出しました"); }
  });
}

function copyText(text,msg){

function unitsView(){
  return `<section id="view-units" hidden>
    ${subnav("calc")}
    ${viewHead("units","単位変換","長さ・圧力・トルク・温度など、現場でよく使う単位を換算します")}
    <div class="ugrid">
      <div class="card">${H2("list","種類を選ぶ")}<div class="cats" id="u-cats">${UCATS.map(c=>`<button type="button" data-cat="${c[0]}"><b>${c[1]}</b><span>${c[2]}</span></button>`).join("")}</div></div>
      <div class="stack">
        <div class="card">
          <div class="uhead"><h2 class="h" style="margin:0">${ICON.swap}<span id="u-title"></span></h2><button class="btn small primary" id="u-save">${ICON.save}記録</button></div>
          <div class="urow">
            <label class="flabel">変換する値<div class="inbox big"><input id="u-v" type="number" inputmode="decimal" step="any" aria-label="変換する値"></div></label>
            <label class="flabel">単位${selbox('<select id="u-from" aria-label="変換元の単位"></select>')}</label>
          </div>
          <div class="uswap"><button class="iconbtn" id="u-swap" aria-label="単位を入れ替える">${I('<path d="M8 4v16M4 16l4 4 4-4M16 20V4M12 8l4-4 4 4"/>')}</button></div>
          <div class="ures">
            <div class="dro-mini"><span>変換結果</span><b id="u-out">—</b><small id="u-outu"></small></div>
            <label class="flabel">変換先の単位${selbox('<select id="u-to" aria-label="変換先の単位"></select>')}</label>
          </div>
          <div class="ufoot"><span id="u-rate"></span><button class="btn small ghost" id="u-copy">${ICON.copy}結果をコピー</button></div>
        </div>
        <div class="card">${H2("table","すべての単位での値")}<div class="tablewrap"><table class="ref pick" id="u-all"></table></div><p class="hint">行を押すと、その単位を変換先にします。</p></div>
      </div>
    </div></section>`;
}
function renderUnits(){
  const u=S.units, c=UC[u.cat], us=c[3];
  if(!us.some(x=>x[0]===u.from)) u.from=us[0][0];
  if(!us.some(x=>x[0]===u.to)) u.to=us[1][0];
  document.querySelectorAll("#u-cats [data-cat]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.cat===u.cat)));
  $("u-title").textContent=c[1]+"を換算";
  const opts=us.map(x=>`<option value="${x[0]}">${x[0]}　${x[1]}</option>`).join("");
  const fs=$("u-from"), ts=$("u-to");
  if(fs.dataset.cat!==u.cat){ fs.innerHTML=opts; ts.innerHTML=opts; fs.dataset.cat=u.cat; }
  fs.value=u.from; ts.value=u.to;
  const vi=$("u-v"); if(document.activeElement!==vi) vi.value=u.v;
  const r=uconv(u.cat,u.v,u.from,u.to);
  $("u-out").textContent=sig(r); $("u-outu").textContent=u.to;
  $("u-rate").textContent = u.cat==="temp" ? `${u.v} ${u.from} = ${sig(r)} ${u.to}` : `1 ${u.from} = ${sig(uconv(u.cat,1,u.from,u.to))} ${u.to}`;
  $("u-all").innerHTML=`<thead><tr><th>単位</th><th>名前</th><th>値</th></tr></thead><tbody>${us.map(x=>`<tr data-to="${esc(x[0])}" tabindex="0"${x[0]===u.to?' class="on"':""}><td>${esc(x[0])}</td><td class="jp">${esc(x[1])}</td><td>${sig(uconv(u.cat,u.v,u.from,x[0]))}</td></tr>`).join("")}</tbody>`;
  save();
}
function bindUnits(){
  const v=$("view-units");
  v.addEventListener("click",e=>{
    const c=e.target.closest("[data-cat]"); if(c){ S.units.cat=c.dataset.cat; const us=UC[c.dataset.cat][3]; S.units.from=us[0][0]; S.units.to=us[1][0]; S.units.v=1; renderUnits(); return; }
    if(e.target.closest("#u-swap")){ const f=S.units.from; S.units.v=+uconv(S.units.cat,S.units.v,S.units.from,S.units.to).toPrecision(10); S.units.from=S.units.to; S.units.to=f; renderUnits(); return; }
    const tr=e.target.closest("tr[data-to]"); if(tr){ S.units.to=tr.dataset.to; renderUnits(); return; }
    if(e.target.closest("#u-copy")){ copyText($("u-out").textContent.replace(/,/g,"")+" "+S.units.to,"結果をコピーしました"); return; }
    if(e.target.closest("#u-save")){ const u=S.units, r=uconv(u.cat,u.v,u.from,u.to);
      openSave({kind:"units",title:"単位変換",cond:UC[u.cat][1],cells:[["変換前",sig(u.v),u.from],["変換後",sig(r),u.to]],rows:[],inputs:clone(u)}); }
  });
  v.addEventListener("keydown",e=>{ const tr=e.target.closest("tr[data-to]"); if(tr&&(e.key==="Enter"||e.key===" ")){ e.preventDefault(); tr.click(); } });
  $("u-v").addEventListener("input",e=>{ const x=parseFloat(e.target.value); if(isFinite(x)){ S.units.v=x; renderUnits(); } });
  $("u-from").addEventListener("change",e=>{ S.units.from=e.target.value; renderUnits(); });
  $("u-to").addEventListener("change",e=>{ S.units.to=e.target.value; renderUnits(); });
}

/* ================= 起動 ================= */
$("views").innerHTML=calcView()+unitsView()+Object.keys(TOOLS).map(toolView).join("")+notesView()+
  `<p class="foot">${ICON.info}<span>推奨切削速度・速度比などは一般的な目安です。実際の条件は工具・砥石メーカーのカタログ値と、機械の剛性・クーラント条件に合わせて調整してください。砥石は表示された最高使用周速度を超えて使わないでください。</span></p>`;
buildNav();
Object.keys(TOOLS).forEach(id=>{ buildPanel(id); bindTool(id); });
bindCalc(); bindNotes(); bindUnits(); renderUnits();
expr="1000×180÷(π×50)"; showCalc(); justEval=true; renderHist();
renderAll(); refreshChrome();
go(ROUTES.includes(location.hash.slice(1))?location.hash.slice(1):S.route);
initStore(); initDictation();
})();
</script>

</body>
</html>
